# ==============================================================================
# VOLTERRA C ABI Header Generator Configuration (cbindgen.toml)
# Produces volterra_ffi.h compatible with Clang (C99/C11) and Swift Clang Importer
# ==============================================================================

language = "C"
include_guard = "VOLTERRA_FFI_H"
pragma_once = true
autogen_warning = "/* Warning: This file is automatically generated by cbindgen. Do not modify manually. */"
include_version = false
cpp_compat = true
style = "both"
usize_is_size_t = true
tab_width = 4
line_length = 100

header = """
/*
 * VOLTERRA macOS Smart Disk Copy & Data Recovery
 * C ABI Interface for Swift Concurrency Bridge
 * Target Architectures: arm64 + x86_64 Universal macOS Binary
 */
"""

sys_includes = [
    "stdint.h",
    "stdbool.h",
    "stddef.h",
    "sys/types.h",
]

after_includes = """
#if defined(__clang__)
#define VOLTERRA_EXPORT __attribute__((visibility("default")))
#define VOLTERRA_WARN_UNUSED_RESULT __attribute__((warn_unused_result))
#else
#define VOLTERRA_EXPORT
#define VOLTERRA_WARN_UNUSED_RESULT
#endif

/* Convenience & Compatibility Macro Aliases */
#define VOLTERRA_OK VOLTERRA_ERROR_CODE_OK
#define VOLTERRA_ERR_INVALID_ARGUMENT VOLTERRA_ERROR_CODE_ERR_INVALID_ARGUMENT
#define VOLTERRA_ERR_SOURCE_NOT_FOUND VOLTERRA_ERROR_CODE_ERR_SOURCE_NOT_FOUND
#define VOLTERRA_ERR_TARGET_NOT_FOUND VOLTERRA_ERROR_CODE_ERR_TARGET_NOT_FOUND
#define VOLTERRA_ERR_TARGET_EXISTS VOLTERRA_ERROR_CODE_ERR_TARGET_EXISTS
#define VOLTERRA_ERR_INSUFFICIENT_SPACE VOLTERRA_ERROR_CODE_ERR_INSUFFICIENT_SPACE
#define VOLTERRA_ERR_PERMISSION_DENIED VOLTERRA_ERROR_CODE_ERR_PERMISSION_DENIED
#define VOLTERRA_ERR_READ_IO VOLTERRA_ERROR_CODE_ERR_READ_IO
#define VOLTERRA_ERR_WRITE_IO VOLTERRA_ERROR_CODE_ERR_WRITE_IO
#define VOLTERRA_ERR_INTEGRITY_MISMATCH VOLTERRA_ERROR_CODE_ERR_INTEGRITY_MISMATCH
#define VOLTERRA_ERR_DISK_DISCONNECTED VOLTERRA_ERROR_CODE_ERR_DISK_DISCONNECTED
#define VOLTERRA_ERR_SOURCE_MODIFIED VOLTERRA_ERROR_CODE_ERR_SOURCE_MODIFIED
#define VOLTERRA_ERR_UNSUPPORTED_METADATA VOLTERRA_ERROR_CODE_ERR_UNSUPPORTED_METADATA
#define VOLTERRA_ERR_INVALID_STATE VOLTERRA_ERROR_CODE_ERR_INVALID_STATE
#define VOLTERRA_ERR_RECOVERY_FAILED VOLTERRA_ERROR_CODE_ERR_RECOVERY_FAILED
#define VOLTERRA_ERR_INTERNAL_PANIC VOLTERRA_ERROR_CODE_ERR_INTERNAL_PANIC

#define VOLTERRA_EVENT_STATE_CHANGED VOLTERRA_EVENT_KIND_STATE_CHANGED
#define VOLTERRA_EVENT_SCANNING_PROGRESS VOLTERRA_EVENT_KIND_SCANNING_PROGRESS
#define VOLTERRA_EVENT_SCANNING_COMPLETE VOLTERRA_EVENT_KIND_SCANNING_COMPLETE
#define VOLTERRA_EVENT_FILE_STARTED VOLTERRA_EVENT_KIND_FILE_STARTED
#define VOLTERRA_EVENT_CHUNK_PROGRESS VOLTERRA_EVENT_KIND_CHUNK_PROGRESS
#define VOLTERRA_EVENT_FILE_COMPLETED VOLTERRA_EVENT_KIND_FILE_COMPLETED
#define VOLTERRA_EVENT_FILE_QUARANTINED VOLTERRA_EVENT_KIND_FILE_QUARANTINED
#define VOLTERRA_EVENT_TELEMETRY_UPDATED VOLTERRA_EVENT_KIND_TELEMETRY_UPDATED
#define VOLTERRA_EVENT_BOTTLENECK_DETECTED VOLTERRA_EVENT_KIND_BOTTLENECK_DETECTED
#define VOLTERRA_EVENT_DISK_WARNING VOLTERRA_EVENT_KIND_DISK_WARNING
#define VOLTERRA_EVENT_JOB_COMPLETED VOLTERRA_EVENT_KIND_JOB_COMPLETED
#define VOLTERRA_EVENT_JOB_FAILED VOLTERRA_EVENT_KIND_JOB_FAILED

#define VOLTERRA_REPORT_JSON VOLTERRA_REPORT_FORMAT_JSON
#define VOLTERRA_REPORT_CSV VOLTERRA_REPORT_FORMAT_CSV
"""

[parse]
parse_deps = false
clean = true

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true
add_sentinel = false
derive_helper_methods = false

[fn]
rename_args = "SnakeCase"
sort_by = "None"
must_use = "VOLTERRA_WARN_UNUSED_RESULT"

[struct]
rename_fields = "SnakeCase"
derive_constructor = false
derive_eq = false

[const]
allow_static_const = true
allow_constexpr = false
sort_by = "None"

[export]
include = [
    "volterra_mode",
    "volterra_mode_t",
    "volterra_state",
    "volterra_state_t",
    "volterra_bottleneck",
    "volterra_bottleneck_t",
    "volterra_event_kind",
    "volterra_event_kind_t",
    "volterra_error_code",
    "volterra_error_code_t",
    "volterra_report_format",
    "volterra_report_format_t",
    "volterra_job_t",
    "volterra_error_t",
    "volterra_config_t",
    "volterra_snapshot_t",
    "volterra_telemetry_t",
    "volterra_extent_t",
    "volterra_error_item_t",
    "volterra_error_list_t",
    "volterra_disk_t",
    "volterra_disk_list_t",
    "volterra_event_t",
    "volterra_event_callback_fn",
]
